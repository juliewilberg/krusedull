<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krusedull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: squared-notebook page with sticker-style cards; players | drawing board | guesses,
   collapsing to a player strip above the board on narrow screens */
:root{
  --paper:#f4f6fb; --grid:#dfe6f2; --card:#ffffff; --line:#cdd6e5; --edge:#1c2740; --drop:#1c2740;
  --ink:#1c2740; --ink-soft:#5b6780; --accent:#2f5bea; --accent-ink:#ffffff;
  --marker:#ffd43b; --on-marker:#1c2740; --good:#1d9a5f; --good-bg:#e3f6ec; --bad:#d23f45; --pink:#ff6b8b;
  --shadow:4px 4px 0 color-mix(in srgb,var(--drop) 16%,transparent);
  --f-hand:"Gochi Hand","Comic Sans MS","Segoe Print",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131925; --grid:#1b2433; --card:#1a2231; --line:#2c3850; --edge:#56637f; --drop:#05080f;
  --ink:#e7ecf5; --ink-soft:#97a3ba; --accent:#7f9cff; --accent-ink:#0f1522;
  --marker:#f5c518; --on-marker:#1c2740; --good:#3fcf8e; --good-bg:#173528; --bad:#ff6b70;
  --shadow:4px 4px 0 color-mix(in srgb,var(--drop) 70%,transparent);
  color-scheme:dark}
  :root:not([data-theme="light"]) .av svg{filter:drop-shadow(0 0 1px rgba(255,255,255,.6))}}
:root[data-theme="dark"]{
  --paper:#131925; --grid:#1b2433; --card:#1a2231; --line:#2c3850; --edge:#56637f; --drop:#05080f;
  --ink:#e7ecf5; --ink-soft:#97a3ba; --accent:#7f9cff; --accent-ink:#0f1522;
  --marker:#f5c518; --on-marker:#1c2740; --good:#3fcf8e; --good-bg:#173528; --bad:#ff6b70;
  --shadow:4px 4px 0 color-mix(in srgb,var(--drop) 70%,transparent);
  color-scheme:dark}
:root[data-theme="dark"] .av svg{filter:drop-shadow(0 0 1px rgba(255,255,255,.6))}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px}
.brand{font-family:var(--f-hand);font-size:40px;line-height:1;margin:0;position:relative;padding:0 6px;white-space:nowrap;transform:rotate(-2deg)}
.brand::before{content:"";position:absolute;left:0;right:0;bottom:4px;height:46%;background:var(--marker);border-radius:3px 9px 4px 10px;transform:rotate(-1.5deg);z-index:-1;opacity:.9}
.brand span{position:relative}
.mid{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.status{font-size:12px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;font-weight:700;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px}
.word{font-family:var(--f-mono);font-weight:700;font-size:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:38px;align-items:center}
.word .ch{display:grid;place-items:center;width:1.25em;height:1.5em;background:var(--card);border:2px solid var(--edge);border-radius:7px;box-shadow:2px 2px 0 var(--drop);text-transform:uppercase;line-height:1}
.word .ch.blank{border-style:dashed;border-color:var(--line);box-shadow:none}
.word .ch.new{animation:letter .5s cubic-bezier(.3,1.6,.5,1);background:var(--marker);color:var(--on-marker)}
.word .ch.dash{border:0;box-shadow:none;background:none;width:.7em}
.word .gap{width:.6em}
.word .plain{font-family:var(--f-hand);font-size:30px;font-weight:400}
.word .plain mark{background:var(--marker);color:var(--on-marker);padding:0 8px;border-radius:6px}
.word .len{font-size:13px;color:var(--ink-soft);font-weight:500;margin-left:4px}
.right{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--f-mono);font-weight:700;font-size:22px;min-width:2.6em;text-align:center;font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:2px 10px;box-shadow:2px 2px 0 var(--drop)}
.clock:empty{display:none}
.clock.low{color:#fff;background:var(--bad);animation:pulse .5s ease-in-out infinite alternate}
.ghost{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
.ghost.warn{border-color:var(--bad);color:var(--bad)}

/* main grid */
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;grid-template-areas:"players stage chat";gap:18px;align-items:start}
.card{background:var(--card);border:2px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--f-hand);font-weight:400;font-size:24px;margin:0;padding:10px 14px 4px}
.players{grid-area:players}
.grid.pre{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"stage chat"}
.grid.pre .players{display:none}
.chat{grid-area:chat;display:flex;flex-direction:column;height:min(72vh,620px)}
.stage{grid-area:stage;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:center}

/* avatars */
.av{display:inline-block;position:relative;flex:none;width:40px;height:40px;vertical-align:middle}
.av svg{display:block;width:100%;height:100%;overflow:visible}
.av.s{width:24px;height:24px} .av.l{width:68px;height:68px} .av.xl{width:108px;height:108px}
.av .badge{position:absolute;right:-5px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--marker);border:2px solid var(--edge);font-size:10px;font-style:normal;display:grid;place-items:center;line-height:1}
.av.l .badge{width:28px;height:28px;font-size:15px;right:-6px;top:-12px;bottom:auto;transform:rotate(14deg)}
.av.bump svg{animation:bump .35s cubic-bezier(.3,1.7,.5,1)}
.av.wiggle svg{animation:wiggle 1.1s ease-in-out infinite;transform-origin:50% 90%}
.avpick{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:10px 14px}
.avbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:250px}

/* players */
.plist{list-style:none;margin:0;padding:4px 8px 10px;display:flex;flex-direction:column;gap:4px}
.plist li{position:relative;display:grid;grid-template-columns:1.4ch auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;border:1.5px solid transparent}
.plist li.drawer{background:color-mix(in srgb,var(--marker) 30%,transparent);border-color:var(--marker)}
.plist li.hit{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.plist li.away{opacity:.5}
.rk{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center}
.pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pname small{display:block;font-weight:500;color:var(--ink-soft);font-size:12px}
.pscore{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.pop{position:absolute;right:8px;top:-6px;font-family:var(--f-hand);font-size:22px;color:var(--good);pointer-events:none;animation:rise 1.6s ease-out both;text-shadow:0 1px 0 var(--card),1px 0 0 var(--card),-1px 0 0 var(--card),0 -1px 0 var(--card)}
.side-note{padding:0 14px 12px;color:var(--ink-soft);font-size:13px;display:flex;flex-direction:column;gap:8px}
.side-note:empty{display:none}

/* board */
.board{position:relative;width:100%;max-width:max(300px,calc((100dvh - 250px) * 4 / 3));aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:2px solid var(--edge);box-shadow:6px 6px 0 color-mix(in srgb,var(--drop) 22%,transparent);background:#fff}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;background:#fff}
canvas.can{cursor:crosshair}
.board.free{aspect-ratio:auto;max-width:720px;background:var(--card)}
.board.free #cv,.board.free .timebar,.board.free .who,.board.free .fx{display:none}
.board.free .overlay{position:relative;inset:auto;background:none;backdrop-filter:none;padding:24px 18px}
.timebar{position:absolute;left:0;right:0;top:0;height:7px;background:color-mix(in srgb,var(--edge) 12%,transparent);z-index:2}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:0 4px 4px 0;transition:width .26s linear,background .3s}
.timebar.low i{background:var(--bad)}
.who{position:absolute;left:10px;top:16px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:#1c2740;border:2px solid #1c2740;border-radius:999px;padding:2px 12px 2px 4px;font-weight:700;font-size:13px;pointer-events:none}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.float{position:absolute;bottom:-10px;font-size:34px;line-height:1;animation:floatup 2.1s ease-out forwards}
.overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(3px);overflow:auto}
.overlay.peek{background:none;backdrop-filter:none;place-items:end center;pointer-events:none;padding:12px}
.panel{width:min(540px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;color:var(--ink);animation:panel .3s cubic-bezier(.3,1.4,.5,1)}
.panel h3{font-family:var(--f-hand);font-weight:400;font-size:36px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--ink-soft)}
.panel .big{font-family:var(--f-hand);font-size:46px;line-height:1.1;color:var(--ink)}
.panel .big mark{background:var(--marker);color:var(--on-marker);padding:0 12px;border-radius:8px;display:inline-block;transform:rotate(-1.5deg)}
.panel.reveal{background:var(--card);border:2px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px 12px;gap:6px;pointer-events:auto;animation:slideup .35s cubic-bezier(.3,1.4,.5,1)}
.panel.reveal .big{font-size:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:13px}
.chip b{font-family:var(--f-mono);color:var(--good)}
.chip.away{opacity:.5}
.seat{display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;font-weight:700;font-size:13px;animation:bump .4s cubic-bezier(.3,1.7,.5,1)}
.seat span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .av{width:52px;height:52px}
.seat.away{opacity:.5}
.heroes{display:flex;justify-content:center;gap:10px}
.heroes .av{width:58px;height:58px;animation:bob 2.4s ease-in-out infinite}
.heroes .av:nth-child(2){animation-delay:-.5s}.heroes .av:nth-child(3){animation-delay:-1s}.heroes .av:nth-child(4){animation-delay:-1.5s}.heroes .av:nth-child(5){animation-delay:-2s}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:end}
.field{display:flex;flex-direction:column;gap:3px;text-align:left;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,textarea{background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.field input{width:200px;max-width:100%}
textarea{width:100%;min-height:72px;resize:vertical}
details{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.check{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:14px}
.btn{border-radius:12px;padding:9px 18px;font-weight:700;cursor:pointer;background:var(--card);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--drop);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--drop)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.go{font-family:var(--f-hand);font-weight:400;font-size:26px;padding:8px 30px;background:var(--marker);color:var(--on-marker)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.word-pick{font-family:var(--f-hand);font-size:28px;font-weight:400;padding:14px 22px;background:var(--marker);color:var(--on-marker);transform:rotate(-2deg)}
.btn.word-pick:nth-child(2){transform:rotate(1.5deg)}
.btn.word-pick:hover:not(:disabled){transform:rotate(0) scale(1.06)}
.hint{font-size:13px;color:var(--ink-soft)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.rank li{display:grid;grid-template-columns:2ch auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:700}
.rank .n{font-family:var(--f-mono);color:var(--ink-soft)}
.rank .s{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding-top:14px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;width:112px;min-width:0;animation:slideup .5s cubic-bezier(.3,1.4,.5,1) both}
.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .s{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--ink-soft)}
.pod .step{width:100%;border:2px solid var(--edge);border-bottom:0;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--f-hand);font-size:34px;color:var(--on-marker);height:56px;background:#d9dfea;margin-top:4px}
.pod.p1{animation-delay:.3s}.pod.p1 .step{height:92px;background:var(--marker)}
.pod.p2{animation-delay:.15s}.pod.p3 .step{height:38px;background:#f1b98a}

/* tools */
.tools,.reacts{width:100%;max-width:max(300px,calc((100dvh - 250px) * 4 / 3));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow)}
.reacts{width:auto;gap:4px;border-radius:999px;padding:4px 10px}
.reacts button{background:none;border:0;font-size:26px;line-height:1;padding:4px 6px;cursor:pointer;border-radius:10px;transition:transform .1s}
.reacts button:hover{transform:scale(1.25) rotate(-6deg)}
.reacts button:active{transform:scale(.9)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);cursor:pointer;padding:0;transition:transform .1s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{transform:scale(1.18);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--edge)}
.sizes{display:flex;gap:4px}
.sz{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"],.tool[aria-pressed="true"]{background:var(--marker);border-color:var(--edge)}
.sz[aria-pressed="true"] i{background:var(--on-marker)}
.tool{height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;cursor:pointer;font-weight:700;font-size:13px}
.tool:hover{border-color:var(--edge)}
.tool:active{transform:translateY(1px)}
.tool[aria-pressed="true"]{color:var(--on-marker)}
.tool.dice{background:var(--marker);color:var(--on-marker);border-color:var(--edge)}

/* chat */
.log{flex:1;overflow-y:auto;padding:4px 12px 8px;display:flex;flex-direction:column;gap:5px;min-height:0}
.msg{font-size:14px;overflow-wrap:anywhere;animation:msg .2s ease-out}
.msg .av{margin-right:5px;vertical-align:-6px}
.msg b{font-weight:700}
.msg.sys{color:var(--ink-soft);font-size:12px;text-align:center;padding:2px 0}
.msg.hit{color:var(--good);font-weight:700;background:var(--good-bg);border-radius:10px;padding:4px 8px}
.msg.secret{background:var(--good-bg);border-radius:10px;padding:3px 8px}
.guess{display:flex;gap:6px;padding:10px;border-top:2px solid var(--edge)}
.guess input{flex:1;min-width:0;background:var(--paper);border:2px solid var(--edge);border-radius:10px;padding:9px 10px}
.guess button{border:2px solid var(--edge);border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 14px;cursor:pointer}
.guess input:disabled,.guess button:disabled{opacity:.55}
.guess.shake{animation:shake .3s}
.notice{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:10px 14px;font-size:14px}
.share{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.share code{font-family:var(--f-mono);font-size:13px;background:var(--card);border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;max-width:100%;overflow-wrap:anywhere}
.or{font-size:13px;color:var(--ink-soft)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes pulse{to{transform:scale(1.1)}}
@keyframes letter{from{transform:scale(.3) rotate(-20deg)}}
@keyframes bump{from{transform:scale(.6)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:translateY(-4px) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes floatup{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1;transform:translate(0,-30px) scale(1.2)}100%{opacity:0;transform:translate(var(--dx,0),-260px) scale(1)}}
@keyframes panel{from{opacity:0;transform:scale(.94)}}
@keyframes slideup{from{opacity:0;transform:translateY(24px)}}
@keyframes msg{from{opacity:0;transform:translateY(4px)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

@media (max-width:1040px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"players" "stage" "chat";gap:12px}
  .grid.pre{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "chat"}
  .players h2{display:none}
  .plist{flex-direction:row;overflow-x:auto;padding:8px;gap:6px}
  .plist li{grid-template-columns:auto;justify-items:center;text-align:center;flex:none;width:78px;padding:6px 4px;gap:1px}
  .rk,.pname small{display:none}
  .pname{max-width:100%;font-size:12px}
  .pscore{font-size:12px}
  .side-note{padding-top:4px}
  .chat{height:340px}
  .board,.tools{max-width:max(300px,calc((100dvh - 390px) * 4 / 3))}
}
@media (max-width:640px){
  .top{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand right" "mid mid";gap:10px}
  .brand{grid-area:brand;font-size:32px} .mid{grid-area:mid} .right{grid-area:right;justify-self:end}
  .chat{height:280px} .chat h2{display:none}
  .word{font-size:19px}
  .panel h3{font-size:28px} .panel .big{font-size:34px} .panel.reveal .big{font-size:28px}
  .board,.tools{max-width:max(280px,calc((100dvh - 300px) * 4 / 3))}
  .board.free .overlay{padding:18px 12px}
  .pod{width:92px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 class="brand"><span>Krusedull</span></h1>

  `<g fill="#fff" stroke="${INK}" stroke-width="1.6"><circle cx="47" cy="12.5" r="3.6"/><circle cx="52" cy="16.5" r="3.6"/><circle cx="50" cy="22.5" r="3.6"/><circle cx="44" cy="22.5" r="3.6"/><circle cx="42" cy="16.5" r="3.6"/></g><circle cx="47" cy="18" r="3.4" fill="#ffd43b" stroke="${INK}" stroke-width="1.6"/>`,
  `<path d="M32 14l-10-6v12zM32 14l10-6v12z" fill="#ff6b8b" ${EDGE}/><circle cx="32" cy="14" r="3.2" fill="#ff6b8b" ${EDGE}/>`,
  `<rect x="22" y="2.5" width="20" height="15" rx="2" fill="${INK}" ${EDGE}/><path d="M22 13h20" stroke="#e23b3b" stroke-width="3"/><path d="M15 18h34" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`,
  `<path d="M19 21c-6-2-8-8-6-13 3 3.5 6.5 5.5 10.5 6.5zM45 21c6-2 8-8 6-13-3 3.5-6.5 5.5-10.5 6.5z" fill="#e23b3b" ${EDGE}/>`,

const HORNS = 8; // drawn behind the head
function avDefault(uid){
  let h = 2166136261;
  for (const ch of String(uid)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const o = {};
  for (const k of AV_KEYS){ o[k] = h % AV_N[k]; h = Math.floor(h / AV_N[k]); }
  return o;
}
function avParse(code){
  if (typeof code !== "string" || !/^\d{1,2}(\.\d{1,2}){4}$/.test(code)) return null;
  const n = code.split(".").map(Number), o = {};
  AV_KEYS.forEach((k, i) => { o[k] = n[i] % AV_N[k]; });
  return o;
}

// Built only from the constant fragments above and validated indexes, so it is safe as innerHTML.

  return `<svg viewBox="0 0 64 64" aria-hidden="true">${o.h === HORNS ? AV_HATS[HORNS] : ""}` +
    `<g fill="${AV_COLORS[o.c]}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round">${AV_SHAPES[o.s]}</g>` +
    `<g fill="#ff6b8b" opacity=".35"><circle cx="18.5" cy="41.5" r="3"/><circle cx="45.5" cy="41.5" r="3"/></g>` +
    AV_EYES[o.e] + AV_MOUTHS[o.m] + (o.h === HORNS ? "" : AV_HATS[o.h]) + `</svg>`;
}

const S = {
  db:null, room:null, user:null, uid:null, state:null, stateOk:false, players:{}, hits:[], hitsFor:null, unsubHits:null, hitsInit:false,
  present:new Set(), peersReady:false, roomSeen:false, prof:{}, strokes:[], color:COLORS[0], size:9, eraser:false, fill:false,
  secret:null, choices:null, choicesFor:null, once:{}, seenHits:new Set(), phaseKey:"", canvasDoc:null, q:Promise.resolve(),
  readOnly:false, overlayKey:null, quitArmed:false, ready:false, roomId:null, presNick:{}, setupMissing:false,
  myAv:null, pops:{}, prevSc:null, prevScGame:null, wordKey:null, lastMask:null, whoKey:null, lastSec:null, seated:null
};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e){} }
};
const savedNick = () => (store.get("krusedull:nick") || "").slice(0, 24);
const defaults = {phase:"lobby", rounds:3, drawTime:80};
const cur = () => Object.assign({}, defaults, S.state || {});
const drawerOf = st => (st.order || [])[st.turnIdx];
const inGame = st => (st.order || []).includes(S.uid);
const isDrawer = () => { const st = cur(); return st.phase !== "lobby" && drawerOf(st) === S.uid; };
const norm = s => String(s).toLowerCase().normalize("NFC").replace(/\s+/g, " ").trim();
const rid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function isPresent(uid){
  if (uid === S.uid) return true;
  if (!S.room || !S.peersReady) return true;
  return S.present.has(uid);
}
function nameOf(uid){
  const nick = S.players[uid] && S.players[uid].nick;
  return (nick && String(nick).slice(0, 24)) || (S.presNick[uid] && String(S.presNick[uid]).slice(0, 24)) || "Spiller";
}
function avatarOf(uid){
  if (uid === S.uid && S.myAv) return S.myAv;
  return avParse(cur()["av_" + uid]) || avDefault(uid);
}
function avatar(uid, size, badge){
  const d = document.createElement("span"); d.className = "av" + (size ? " " + size : "");
  d.innerHTML = avatarSvg(avatarOf(uid));
  if (badge){ const b = document.createElement("i"); b.className = "badge"; b.textContent = badge; d.appendChild(b); }
  return d;
}
function changeAvatar(part){
  if (S.readOnly || !S.uid || !S.myAv) return;
  const o = Object.assign({}, S.myAv);
  if (part) o[part] = (o[part] + 1) % AV_N[part];
  else for (const k of AV_KEYS) o[k] = Math.floor(Math.random() * AV_N[k]);
  S.myAv = o; store.set("krusedull:av", avCode(o)); sfx("pop");
  clearTimeout(changeAvatar.t); changeAvatar.t = setTimeout(pushAvatar, 500);
  render();
  const p = $("avPrev"); if (p){ p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
}
// Only customised avatars are stored; the default can be derived from the player id by everyone.
function pushAvatar(){
  if (!S.db || !S.uid || !S.myAv || !store.get("krusedull:av")) return;
  queue(() => stateRef().update({ ["av_" + S.uid]: avCode(S.myAv) })).catch(() => {});
}

/* ---------- sound and effects ---------- */
let actx = null;
// Each note is [frequency, start offset, duration, wave type, volume].
const SFX = {
  hit: [[523, 0, .12], [659, .09, .12], [784, .18, .12], [1047, .27, .3]],
  other: [[659, 0, .1], [880, .08, .16]],
  turn: [[392, 0, .12], [523, .12, .12], [659, .24, .24]],
  tick: [[880, 0, .05, "square", .035]],
  reveal: [[523, 0, .14], [392, .14, .28]],
  win: [[523, 0, .14], [523, .15, .1], [523, .26, .1], [659, .37, .18], [784, .56, .18], [1047, .75, .5]],
  pop: [[720, 0, .06, "sine", .06]]
};
function sfx(name){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    for (const [f, at, dur, type, vol] of SFX[name] || []){
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.11, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
    }
  } catch (e){}
}
function confetti(count){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  let c = $("confetti");
  if (!c){ c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c); }
  const x = c.getContext("2d"), w = c.width = innerWidth, h = c.height = innerHeight;
  const ps = Array.from({ length: count || 140 }, () => ({
    x: w / 2 + (Math.random() - .5) * w * .4, y: h * .4, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
    r: Math.random() * 7 + 5, c: AV_COLORS[Math.floor(Math.random() * 8)], a: Math.random() * 6, va: (Math.random() - .5) * .5
  }));
  const t0 = performance.now(); confetti.run = t0;
  (function step(t){
    if (confetti.run !== t0) return;
    x.clearRect(0, 0, w, h);
    if (t - t0 > 3200) return;
    for (const p of ps){
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); x.restore();
    }
    requestAnimationFrame(step);
  })(t0);
}
function floatReact(i){
  const e = REACTS[i], fx = $("fx");
  if (!e || fx.children.length > 40) return;
  const s = document.createElement("span"); s.className = "float"; s.textContent = e;
  s.style.left = (6 + Math.random() * 82) + "%"; s.style.setProperty("--dx", (Math.random() * 70 - 35) + "px");
  fx.appendChild(s); setTimeout(() => s.remove(), 2200);
}
function buildReacts(){
  let last = 0;
  REACTS.forEach((e, i) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = e; b.setAttribute("aria-label", "Reager med " + e);
    b.addEventListener("click", () => {
      const now = Date.now(); if (now - last < 250) return; last = now;
      floatReact(i); emit("react", { i });
    });
    $("reacts").appendChild(b);
  });
}
let namesPending = false;
function ensureNames(ids){
  if (!S.user || namesPending) return;
  ids = [...new Set(ids.filter(Boolean))]; if (!ids.length) return;
  namesPending = true;
  S.user.profiles(ids).then(ps => {
    namesPending = false; let ch = false;
    for (const id in ps){ const o = S.prof[id]; if (!o || o.name !== ps[id].name || o.color !== ps[id].color){ S.prof[id] = ps[id]; ch = true; } }
    if (ch) render();
  }).catch(() => { namesPending = false; });
}

/* ---------- scores ---------- */
function hitsFor(turnId){ return S.hits.filter(h => h.turnId === turnId); }
function hasHit(uid, turnId){ return S.hits.some(h => h.turnId === turnId && h.uid === uid); }
function scores(){
  const sc = {};
  for (const h of S.hits){
    const p = clamp(+h.pts || 0, 0, 600);
    sc[h.uid] = (sc[h.uid] || 0) + p;
    if (h.drawer) sc[h.drawer] = (sc[h.drawer] || 0) + 60;
  }
  return sc;
}
function allGuessed(st){
  const d = drawerOf(st);
  const g = (st.order || []).filter(u => u !== d && isPresent(u));
  return g.length > 0 && g.every(u => hasHit(u, st.turnId));
}
function isLeader(){
  const st = cur();
  const ids = (st.order || []).filter(isPresent).slice().sort();
  return ids[0] === S.uid;
}

/* ---------- canvas ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
function clearCanvas(){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); }
// Flood fill: replays deterministically because fills are stored as strokes ({f:1}) in order.
function floodFill(x, y, hex){
  x = clamp(Math.round(x), 0, W - 1); y = clamp(Math.round(y), 0, H - 1);

  const at = (px, py) => (py * W + px) * 4;

  const fr = parseInt(hex.slice(1, 3), 16), fg = parseInt(hex.slice(3, 5), 16), fb = parseInt(hex.slice(5, 7), 16);
  if (Math.abs(tr - fr) + Math.abs(tg - fg) + Math.abs(tb - fb) < 6) return;
  const TOL = 110; // soaks up anti-aliased edges so no pale halo is left behind
  const match = i => Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) <= TOL;

    const cy = stack.pop(), cx0 = stack.pop();
    let lx = cx0; while (lx >= 0 && !seen[cy * W + lx] && match(at(lx, cy))) lx--; lx++;
    let up = false, down = false;
    for (let px = lx; px < W && !seen[cy * W + px] && match(at(px, cy)); px++){

function tick(){

  const now = Date.now(), d = drawerOf(c), me = S.uid, g = isLeader() ? 0 : 3000;
  if (c.phase === "choosing"){
    if (d === me){
      ensureChoices();
      if (now > c.choiceEndsAt) once("pick" + c.turnId, () => pickWord(S.choices[0]));
    } else if (now > c.choiceEndsAt + 3000 + g || (S.peersReady && !isPresent(d) && now > c.turnStartedAt + 4000 + g)){

      if ((c.hints || 0) < want) once("hint" + want + c.turnId, () => giveHint(c, want));
      if (now >= c.endsAt || allGuessed(c)) once("end" + c.turnId, () => endTurn(c, S.secret.word));
    } else if (d === me){

function onState(snap){

  const st = cur();
  if (prevTurn !== st.turnId){ S.strokes = []; redraw(); applyCanvasDoc(); }
  if (st.gameId && st.gameId !== S.hitsFor) subscribeHits(st.gameId);
  const pk = (st.turnId || "") + "|" + st.phase;
  if (pk !== S.phaseKey){
    const first = S.phaseKey === ""; S.phaseKey = pk;
    if (!first){
      if (st.phase === "choosing") log({ kind: "sys", text: `${drawerOf(st) === S.uid ? "Du" : nameOf(drawerOf(st))} skal tegne nå.` });
      if (st.phase === "reveal") log({ kind: "sys", text: st.word ? `Ordet var «${st.word}».` : "Turen ble hoppet over." });
      if (st.phase === "over") log({ kind: "sys", text: "Spillet er ferdig!" });
      if (st.phase === "choosing" && drawerOf(st) === S.uid) sfx("turn");
      if (st.phase === "reveal") sfx("reveal");

    S.db.doc("data/users/" + S.uid + "/secret").get().then(s => {

}
function subscribeHits(gid){
  if (S.unsubHits) S.unsubHits();
  S.hitsFor = gid; S.hits = []; S.hitsInit = false;
  S.unsubHits = S.db.collection("hits").where("gameId", "==", gid).onSnapshot(snap => {
    S.hits = snap.docs.map(d => d.data()).filter(h => h && typeof h.uid === "string");
    for (const ch of snap.docChanges()){
      if (ch.type !== "added") continue;
      const h = ch.doc.data(), k = ch.doc.id;

      if (S.hitsInit && h.turnId === cur().turnId && h.uid !== S.uid){ log({ kind: "hit", uid: h.uid, text: `${nameOf(h.uid)} gjettet ordet!` }); sfx("other"); }

  }, () => {});
}

/* ---------- Supabase backend ----------
   These adapters expose the same small API the game was written against
   (doc/collection with set/update/delete/get/onSnapshot, and a room with
   emit/on/onPeers/connected), backed by Supabase tables and Realtime. */
function dbError(error){ return Object.assign(new Error(error.message || "Database error"), { code: error.code || "db_error" }); }
const check = res => { if (res.error) throw dbError(res.error); return res; };
const docSnap = (data) => ({ exists: data != null, data: () => data == null ? undefined : data, metadata: { fromCache: false, hasPendingWrites: false } });

function makeDb(sb, room){
  const ready = sb.from("rooms").upsert({ id: room }, { onConflict: "id", ignoreDuplicates: true }).then(check);
  const live = { rooms: [], players: [], hits: [], canvases: [] };
  const pg = sb.channel("db:" + room);
  for (const [table, col] of [["rooms", "id"], ["players", "room_id"], ["hits", "room_id"], ["canvases", "room_id"]]){
    pg.on("postgres_changes", { event: "*", schema: "public", table, filter: col + "=eq." + room }, payload => {
      for (const l of live[table]) l(payload);
    });
  }
  let started = false;
  const start = () => { if (!started){ started = true; pg.subscribe(); } };

  function watch(table, load, next, error){
    let t = null, alive = true;
    const run = () => load().then(v => { if (alive) next(v); }).catch(e => { if (alive && error) error(e); });
    const l = () => { clearTimeout(t); t = setTimeout(run, 80); };
    live[table].push(l); start(); run();
    return () => { alive = false; live[table] = live[table].filter(x => x !== l); };
  }
  function querySnap(rows, prevIds){
    const docs = rows.map(r => ({ id: r.id, exists: true, data: () => r.data, metadata: { fromCache: false, hasPendingWrites: false } }));
    const changes = docs.filter(d => !prevIds.has(d.id)).map(d => ({ type: "added", doc: d }));
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => changes, metadata: { fromCache: false, hasPendingWrites: false } };
  }
  const playerRow = r => ({ id: r.pid, data: { nick: r.nick, joinedAt: r.joined_at } });
  const hitRow = r => ({ id: r.turn_id + "~" + r.pid, data: { gameId: r.game_id, turnId: r.turn_id, uid: r.pid, drawer: r.drawer, pts: r.pts, at: r.at } });

  const loadState = async () => { await ready; const r = check(await sb.from("rooms").select("state").eq("id", room).maybeSingle()); return docSnap(r.data ? r.data.state : null); };
  const loadCanvas = async () => { const r = check(await sb.from("canvases").select("turn_id,strokes").eq("room_id", room).maybeSingle()); return docSnap(r.data ? { turnId: r.data.turn_id, strokes: r.data.strokes } : null); };
  const secretKey = "krusedull:" + room + ":secret";

  function doc(path){
    const [col, ...rest] = path.split("/"); const id = rest.join("/");
    if (path === "game/state") return {
      get: loadState,
      set: async obj => { await ready; check(await sb.from("rooms").update({ state: obj, updated_at: new Date().toISOString() }).eq("id", room)); },
      update: async patch => { await ready; check(await sb.rpc("merge_state", { p_room: room, p_patch: patch })); },
      onSnapshot: (next, error) => watch("rooms", loadState, next, error)
    };
    if (path === "canvas/current") return {
      get: loadCanvas,
      set: async d => { await ready; check(await sb.from("canvases").upsert({ room_id: room, turn_id: d.turnId, strokes: d.strokes, updated_at: new Date().toISOString() })); },
      onSnapshot: (next, error) => watch("canvases", loadCanvas, next, error)
    };
    if (col === "players") return {
      set: async d => { await ready; check(await sb.from("players").upsert({ room_id: room, pid: id, nick: d.nick || "", joined_at: d.joinedAt || Date.now() })); },
      update: async d => { check(await sb.from("players").update({ nick: d.nick || "" }).eq("room_id", room).eq("pid", id)); },
      delete: async () => { check(await sb.from("players").delete().eq("room_id", room).eq("pid", id)); }
    };
    if (col === "hits"){
      const [turn, pid] = id.split("~");
      return {
        set: async h => { await ready; check(await sb.from("hits").upsert({ room_id: room, turn_id: turn, pid, game_id: h.gameId, drawer: h.drawer || null, pts: h.pts, at: h.at })); },
        delete: async () => { check(await sb.from("hits").delete().eq("room_id", room).eq("turn_id", turn).eq("pid", pid)); }
      };
    }
    if (col === "data") return {
      // The drawer's secret word stays in this browser only.
      get: async () => { try { return docSnap(JSON.parse(store.get(secretKey) || "null")); } catch (e){ return docSnap(null); } },
      set: async d => { store.set(secretKey, JSON.stringify(d)); }
    };
    throw new TypeError("Unknown path " + path);
  }
  function collection(name){
    const filters = []; let lim = null;
    const q = {
      where(field, op, value){ filters.push([field, op, value]); return q; },
      limit(n){ lim = n; return q; },
      async get(){
        let prev = new Set();
        if (name === "players"){
          const r = check(await sb.from("players").select("*").eq("room_id", room));
          return querySnap(r.data.map(playerRow), prev);
        }
        let b = sb.from("hits").select("*").eq("room_id", room);
        for (const [f, op, v] of filters){ if (f !== "gameId") continue; b = op === "==" ? b.eq("game_id", v) : b.neq("game_id", v); }
        if (lim) b = b.limit(lim);
        const r = check(await b);
        return querySnap(r.data.map(hitRow), prev);
      },
      onSnapshot(next, error){
        let prevIds = new Set();
        const load = async () => { const s = await q.get(); const snap = querySnap(s.docs.map(d => ({ id: d.id, data: d.data() })), prevIds); prevIds = new Set(s.docs.map(d => d.id)); return snap; };
        return watch(name === "players" ? "players" : "hits", load, next, error);
      }
    };
    return q;
  }
  return { doc, collection };
}

function makeRoom(sb, room, pid){
  const ch = sb.channel("krusedull:" + room, { config: { broadcast: { self: false }, presence: { key: pid } } });
  const peerHandlers = []; let connected = false, nick = savedNick(), peers = [];
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState();
    peers = Object.keys(st).map(k => ({ by: k, kind: "viewer", isMe: k === pid, presence: (st[k] && st[k][0]) || {} }));
    for (const h of peerHandlers) h({ peers });
  });
  return {
    start(){
      ch.subscribe(status => {
        connected = status === "SUBSCRIBED";
        if (connected) ch.track({ nick }).catch(() => {});
      });
    },
    setNick(v){ nick = v; if (connected) ch.track({ nick }).catch(() => {}); },
    connected: () => connected,
    emit(topic, data){
      if (!connected) return Promise.resolve();
      return ch.send({ type: "broadcast", event: topic, payload: { from: pid, d: data } }).then(() => {});
    },
    on(topic, fn){
      ch.on("broadcast", { event: topic }, ({ payload }) => {
        if (!payload || typeof payload !== "object") return;
        fn({ topic, data: payload.d, by: typeof payload.from === "string" ? payload.from.slice(0, 40) : null, isMe: false, sameTab: false, kind: "viewer" });
      });
    },
    onPeers(fn){ peerHandlers.push(fn); }
  };
}

async function boot(){
  buildTools(); buildReacts(); render();
  setInterval(tick, 250);
  const cfg = window.KRUSEDULL_CONFIG || {};
  S.roomId = roomFromHash();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase){ S.setupMissing = true; S.ready = true; render(); return; }
  if (!S.roomId){ S.ready = true; render(); return; }
  let pid = store.get("krusedull:pid");
  if (!pid || !/^[a-z0-9]{8,40}$/.test(pid)){ pid = rid() + rid(); store.set("krusedull:pid", pid); }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const db = makeDb(sb, S.roomId), room = makeRoom(sb, S.roomId, pid);
  S.db = db; S.user = null; S.room = room; S.uid = pid;
  S.myAv = avParse(store.get("krusedull:av")) || avDefault(pid);
  setNick = v => room.setNick(v);
  S.ready = true;

  const timeout = setTimeout(() => { if (!S.stateOk){ const n = $("notice"); n.hidden = false; n.textContent = "Får ikke kontakt med spillet ennå. Sjekk nettverket – siden prøver igjen av seg selv."; } }, 10000);
  db.doc("game/state").onSnapshot(s => { if (!s.metadata.fromCache) clearTimeout(timeout); onState(s); }, () => {});
  db.collection("players").onSnapshot(snap => {
    const p = {}; for (const d of snap.docs){ const v = d.data(); if (v) p[d.id] = { nick: typeof v.nick === "string" ? v.nick : "", joinedAt: +v.joinedAt || 0 }; }
    S.players = p; render();
  }, () => {});
  db.doc("canvas/current").onSnapshot(s => { S.canvasDoc = s.exists ? s.data() : null; applyCanvasDoc(); }, () => {});

  if (room){
    room.onPeers(ch => {
      S.present = new Set(ch.peers.filter(p => p.kind === "viewer" && p.by).map(p => p.by));
      for (const p of ch.peers) if (p.presence && typeof p.presence.nick === "string") S.presNick[p.by] = p.presence.nick;
      if (!S.roomSeen){ S.roomSeen = true; setTimeout(() => { S.peersReady = true; render(); }, 3000); }
      render();
    }, () => { S.room = null; render(); });
    const fromDrawer = m => { const st = cur(); return m.data && m.data.t === st.turnId && (m.by === drawerOf(st) || m.by === null); };
    room.on("seg", m => {
      if (m.sameTab || !fromDrawer(m) || isDrawer()) return;
      const dd = m.data; const id = String(dd.id || "").slice(0, 16); if (!id) return;
      let s = S.strokes.find(x => x.id === id);
      if (!s){ s = { id, c: okColor(dd.c), s: clamp(+dd.s || 4, 1, 60), p: [] }; if (dd.f) s.f = 1; S.strokes.push(s); }
      else if (s.f) return;
      const from = s.p.length; s.p.push(...cleanPts(dd.p)); drawStroke(s, from);
    });
    room.on("undo", m => {
      if (m.sameTab || !fromDrawer(m) || isDrawer()) return;
      S.strokes = S.strokes.filter(x => x.id !== m.data.id); redraw();
    });
    room.on("clear", m => {
      if (m.sameTab || !fromDrawer(m) || isDrawer()) return;
      S.strokes = []; redraw();
    });
    room.on("react", m => { if (m.by && m.data && Number.isInteger(m.data.i)) floatReact(m.data.i); });
    room.on("chat", m => {
      if (m.sameTab || !m.data || typeof m.data.text !== "string" || !m.by) return;
      showChat(m.by, m.data.text.slice(0, 120), !!m.data.s);
    });
    room.start();
  }
  render();
}
boot();
})();
</script>
